spring:
  application:
    name: user
  config:
    import: optional:file:.env[.properties]
  docker:
    compose:
      enabled: false
  datasource:
    url: ${SUPABASE_DB_URL}
    username: ${SUPABASE_DB_USERNAME}
    password: ${SUPABASE_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: public
    schemas:
      - public
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: public
    open-in-view: false

supabase:
  url: ${SUPABASE_URL}
  publishable-key: ${SUPABASE_PUBLISHABLE_KEY}
  secret-key: ${SUPABASE_SECRET_KEY}
  jwks-url: ${SUPABASE_JWKS_URL}

jwt:
  secret: ${JWT_SECRET:${SUPABASE_SECRET_KEY}}
